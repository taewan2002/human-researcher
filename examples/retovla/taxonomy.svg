<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1068" viewBox="0 0 1060 1068" role="group" aria-labelledby="vla-tax-title vla-tax-desc">
<title id="vla-tax-title">VLA taxonomy: 행동 표현과 생성 방식</title>
<desc id="vla-tax-desc">VLM 기반 VLA를 이산 행동 토큰과 연속 행동으로 분류합니다. 이산 계열에는 차원별 양자화의 RT-2·OpenVLA와 공간 양자화의 SpatialVLA가 있습니다. 연속 계열에는 직접 회귀의 OpenVLA-OFT, diffusion의 TinyVLA·CogACT, flow matching의 π0·SmolVLA가 있습니다. RetoVLA는 SmolVLA와 같은 flow matching 가지의 제안 방법입니다. 선은 범주 소속을 나타냅니다.</desc>
<style>
.tax-bg{fill:#fffef9}.tax-text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#202c29}.tax-edge{fill:none;stroke:#9cab9d;stroke-width:1.6;stroke-linejoin:round}.tax-node rect{fill:#fffef9;stroke:#c5d0c4;stroke-width:1.3}.tax-node .tax-label{font-size:16px;font-weight:650}.tax-node .tax-sub{font-size:12px;fill:#56655e}.tax-root rect{fill:#263d33;stroke:#263d33}.tax-root .tax-label,.tax-root .tax-sub{fill:#fffef9}.tax-family rect{fill:#e6eee5;stroke:#9caf9e}.tax-category rect{fill:#f1f3eb}.tax-proposed rect{fill:#e0ecda;stroke:#235c49;stroke-width:2.2;stroke-dasharray:6 4}.tax-proposed .tax-label{fill:#235c49;font-weight:750}.tax-paper .tax-label{text-decoration:underline;text-decoration-color:#9caf9e;text-underline-offset:4px}.tax-link:focus{outline:3px solid #a24d2b;outline-offset:3px}.tax-link:hover rect{stroke:#235c49;stroke-width:2}.tax-column{font-size:11px;fill:#697b6d;letter-spacing:1px}.tax-note{font-size:12px;fill:#56655e}
</style>
