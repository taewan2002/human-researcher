<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
<title id="title">실험이 끝나면 무엇을 결정할까요?</title><desc id="desc">미실행 정밀도 비교에서 측정할 값과 결과별 다음 결정을 연결한 계획도입니다. 품질을 충족하는 메모리 절감, 품질 미달, 큰 불확실성, OOM을 구분합니다.</desc>
<rect x="0" y="0" width="1600" height="930" rx="0" fill="#f8f7f2" stroke="none" stroke-width="1.6"/>
<text x="64" y="50" fill="#246b53" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="17" font-weight="700" text-anchor="start">03 / EXPERIMENT TO DECISION</text>
<text x="64" y="124" fill="#192f34" font-family="'Times New Roman',Times,serif" font-size="64" font-weight="400" text-anchor="start">Every test should change a decision.</text>
<text x="64" y="177" fill="#192f34" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="31" font-weight="700" text-anchor="start">실험이 끝나면 무엇을 결정할까요?</text>
<text x="1536" y="50" fill="#466788" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="18" font-weight="400" text-anchor="end">PLANNED / 미실행</text>
<text x="64" y="262" fill="#246b53" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="17" font-weight="700" text-anchor="start">COMPARE</text>
<rect x="64" y="291" width="333" height="305" rx="5" fill="#192f34" stroke="none" stroke-width="1.6"/>
<text x="89" y="344" fill="#ffffff" font-family="'Times New Roman',Times,serif" font-size="36" font-weight="400" text-anchor="start">16-bit vs 4-bit</text>
<text x="89" y="389" fill="#deeadf" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="23" font-weight="400" text-anchor="start">같은 입력 길이 안에서</text>
<text x="89" y="427" fill="#deeadf" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="23" font-weight="400" text-anchor="start">같은 어댑터·데이터·예산으로</text>
<polyline points="89,469 370,469" fill="none" stroke="#53696a" stroke-width="2" stroke-linejoin="round"/>
<text x="89" y="512" fill="#deeadf" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="20" font-weight="400" text-anchor="start">길이 간 품질 차이를</text>
<text x="89" y="544" fill="#deeadf" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="20" font-weight="400" text-anchor="start">양자화 효과로 해석하지 않습니다.</text>
<polyline points="397,441 458,441" fill="none" stroke="#246b53" stroke-width="2" stroke-linejoin="round"/>
<polyline points="448.9955289764732,436.6503446588877 458,441 448.9955289764732,445.3496553411123" fill="none" stroke="#246b53" stroke-width="2" stroke-linejoin="round"/>
<text x="477" y="262" fill="#246b53" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="17" font-weight="700" text-anchor="start">MEASURE</text>
<rect x="477" y="291" width="350" height="305" rx="5" fill="#ffffff" stroke="#c8d2cb" stroke-width="1.6"/>
<text x="501" y="339" fill="#246b53" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="17" font-weight="700" text-anchor="start">MEMORY</text>
<text x="501" y="374" fill="#596c6d" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="21" font-weight="400" text-anchor="start">allocated / reserved 구분</text>
<text x="501" y="433" fill="#246b53" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="17" font-weight="700" text-anchor="start">QUALITY</text>
<text x="501" y="468" fill="#596c6d" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="21" font-weight="400" text-anchor="start">동일 평가 예시의 held-out NLL</text>
<text x="501" y="527" fill="#246b53" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="17" font-weight="700" text-anchor="start">FEASIBILITY</text>
<text x="501" y="562" fill="#596c6d" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="21" font-weight="400" text-anchor="start">처리량·실패·OOM 기록</text>
<polyline points="827,441 884,441" fill="none" stroke="#246b53" stroke-width="2" stroke-linejoin="round"/>
<polyline points="884,328 884,751" fill="none" stroke="#246b53" stroke-width="2" stroke-linejoin="round"/>
<text x="952" y="262" fill="#246b53" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="17" font-weight="700" text-anchor="start">INTERPRET → ACT</text>
<polyline points="884,328 952,328" fill="none" stroke="#246b53" stroke-width="2" stroke-linejoin="round"/>
<polyline points="942.9955289764732,323.6503446588877 952,328 942.9955289764732,332.3496553411123" fill="none" stroke="#246b53" stroke-width="2" stroke-linejoin="round"/>
<rect x="952" y="291" width="584" height="110" rx="4" fill="#e6eee6" stroke="none" stroke-width="1.6"/>
<text x="974" y="330" fill="#246b53" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="27" font-weight="700" text-anchor="start">메모리 감소 + 품질 허용폭 충족</text>
<text x="974" y="369" fill="#596c6d" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="22" font-weight="400" text-anchor="start">측정한 설정에서 채택을 검토합니다.</text>
<polyline points="884,469 952,469" fill="none" stroke="#a55335" stroke-width="2" stroke-linejoin="round"/>
<polyline points="942.9955289764732,464.6503446588877 952,469 942.9955289764732,473.3496553411123" fill="none" stroke="#a55335" stroke-width="2" stroke-linejoin="round"/>
<rect x="952" y="432" width="584" height="110" rx="4" fill="#f2e8d9" stroke="none" stroke-width="1.6"/>
<text x="974" y="471" fill="#a55335" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="27" font-weight="700" text-anchor="start">메모리 감소 + 품질 기준 미달</text>
<text x="974" y="510" fill="#596c6d" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="22" font-weight="400" text-anchor="start">품질 비용을 분석하고 채택을 보류합니다.</text>
<polyline points="884,610 952,610" fill="none" stroke="#466788" stroke-width="2" stroke-linejoin="round"/>
<polyline points="942.9955289764732,605.6503446588877 952,610 942.9955289764732,614.3496553411123" fill="none" stroke="#466788" stroke-width="2" stroke-linejoin="round"/>
<rect x="952" y="573" width="584" height="110" rx="4" fill="#eaf0f6" stroke="none" stroke-width="1.6"/>
<text x="974" y="612" fill="#466788" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="27" font-weight="700" text-anchor="start">추정의 불확실성이 큼</text>
<text x="974" y="651" fill="#596c6d" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="22" font-weight="400" text-anchor="start">계산 예산 안에서 추가 확인 여부를 정합니다.</text>
<polyline points="884,751 952,751" fill="none" stroke="#596c6d" stroke-width="2" stroke-linejoin="round"/>
<polyline points="942.9955289764732,746.6503446588877 952,751 942.9955289764732,755.3496553411123" fill="none" stroke="#596c6d" stroke-width="2" stroke-linejoin="round"/>
<rect x="952" y="714" width="584" height="110" rx="4" fill="#edf0ed" stroke="none" stroke-width="1.6"/>
<text x="974" y="753" fill="#596c6d" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="27" font-weight="700" text-anchor="start">한 비교 조건이 OOM</text>
<text x="974" y="792" fill="#596c6d" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="22" font-weight="400" text-anchor="start">실행 경계를 보고하고 품질 비교는 유보합니다.</text>
<text x="64" y="671" fill="#246b53" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="17" font-weight="700" text-anchor="start">BEFORE CONFIRMATION</text>
<text x="64" y="712" fill="#192f34" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="25" font-weight="400" text-anchor="start">파일럿으로 실행성과 변동을 확인한 뒤,</text>
<text x="64" y="755" fill="#192f34" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="25" font-weight="400" text-anchor="start">품질 허용폭·반복 수·계산 상한을 고정합니다.</text>
<text x="64" y="798" fill="#192f34" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="25" font-weight="400" text-anchor="start">파일럿 결과와 독립 확인 결과는 구분합니다.</text>
<polyline points="64,859 1536,859" fill="none" stroke="#c8d2cb" stroke-width="2" stroke-linejoin="round"/>
<text x="64" y="895" fill="#596c6d" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="17" font-weight="400" text-anchor="start">출처: LoRA·QLoRA proposal / 계획된 판단 규칙 · 실제 측정값이나 성능 그래프가 아닙니다.</text>
<text x="1536" y="895" fill="#246b53" font-family="NanumSquare,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="16" font-weight="400" text-anchor="end">HUMAN RESEARCHER / 03</text>
</svg>
