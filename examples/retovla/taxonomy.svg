<path d="M28 996 H1030" stroke="#d4dbd1"/><g class="tax-text"><text x="28" y="1021" class="tax-note">실선 = 범주 소속 · 점선 테두리 = 제안 방법 · 위치와 색은 성능 순위나 새로운 기여를 뜻하지 않습니다.</text><text x="28" y="1044" class="tax-note">본 제안서를 위한 분류입니다. 변형별 출력 방식을 기준으로 하며, 전체 분야를 망라하지 않습니다.</text></g></svg>