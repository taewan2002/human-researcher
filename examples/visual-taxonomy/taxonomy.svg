<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1040" viewBox="0 0 1580 1040" role="img" aria-labelledby="title desc">
<title id="title">문서 랭킹 접근법의 계층형 taxonomy</title>
<desc id="desc">가상 문헌 다섯 편의 잠정 분류. 문서 랭킹 방법은 점수 구성에 따라 학습형, 고정 규칙형, 혼합형으로 나뉜다. 학습형의 텍스트 분기에 R1, 텍스트와 메타데이터 결합 분기에 R2와 제안 B가 있다. 고정 규칙형의 메타데이터 분기에 R3가 있다. 혼합형의 학습 텍스트와 고정 메타데이터 결합 분기에 R4가 있다. R5는 정보가 없어 트리 밖에 미분류로 둔다. 연결선은 분류 관계이며 인용이나 성능 순위가 아니다.</desc>
<style>text{font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#172a34}.muted{fill:#576a72}.white{fill:white}.teal{fill:#176f68}.blue{fill:#344cc0}.amber{fill:#855f22}a{text-decoration:none}</style>
<rect width="1580" height="1040" fill="#fcfbf7"/>

<text x="48" y="48" font-size="13" class="teal" font-weight="700" text-anchor="start">HUMAN RESEARCHER / HIERARCHICAL TAXONOMY</text>
<text x="48" y="107" font-size="43" class="" font-weight="700" text-anchor="start">큰 분류에서, 내 연구가 놓이는 가지까지.</text>
<text x="48" y="147" font-size="21" class="muted" font-weight="400" text-anchor="start">접근법의 구조를 먼저 읽고, 대표 문헌과 제안한 연구의 위치를 따라간다.</text>
<text x="48" y="193" font-size="15" class="muted" font-weight="700" text-anchor="start">연구 범위</text>
<text x="350" y="193" font-size="15" class="muted" font-weight="700" text-anchor="start">점수 구성 방식</text>
<text x="716" y="193" font-size="15" class="muted" font-weight="700" text-anchor="start">사용하는 입력과 결합</text>
<text x="1140" y="193" font-size="15" class="muted" font-weight="700" text-anchor="start">대표 문헌 · 제안</text>
