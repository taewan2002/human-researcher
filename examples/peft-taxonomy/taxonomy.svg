<title id="title">PEFT: 무엇을 학습하고 무엇을 고정할까요?</title><desc id="desc">선택한 일곱 논문의 주요 적응 메커니즘을 분류합니다. BitFit, Prefix-Tuning, Adapters, IA3, LoRA, DoRA를 학습 대상에 따라 배치하고 QLoRA의 기반 양자화는 별도 축으로 표시합니다. 분류선은 인용이나 성능 순위가 아닙니다.</desc>
